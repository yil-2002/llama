[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vps-master-bot"
version = "1.0.0"
description = "Self-hosted VPS management via Telegram (Uzbek)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=20.7",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "aiosqlite>=0.19.0",
    "psutil>=5.9.6",
    "docker>=7.0.0",
    "aiohttp>=3.9.1",
    "qrcode[pil]>=7.4.2",
    "APScheduler>=3.10.4",
    "aiolimiter>=1.1.0",
    "Jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "ruff>=0.1.6",
    "mypy>=1.7.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
