# Ishga tushirish: cp .env.example .env && docker compose up -d --build
# Masshtab: docker compose up -d --scale worker=4
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: englishbot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    depends_on: [api]
    deploy:
      replicas: 2

  bot:
    build: ./backend
    command: ["python", "-m", "bot.main"]
    env_file: .env
    depends_on: [api]

  webapp:
    build: ./webapp
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
