version: '3.8'

services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vps-master-bot
    restart: unless-stopped
    env_file:
      - ../.env
    # `privileged: true` olib tashlandi (xavfsizlik). Agar konteyner
    # /var/run/docker.sock ga kira olmasa (Permission denied), quyidagi
    # qatorni oching va <GID> o'rniga hostdagi `stat -c '%g' /var/run/docker.sock`
    # natijasini yozing:
    # group_add:
    #   - "<GID>"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/wireguard:/etc/wireguard:ro
      - /opt/docker:/opt/docker:ro
      - /etc/nginx:/etc/nginx:ro
      - /var/log:/var/log:ro
    network_mode: host
    profiles: ["default"]

  ollama:
    image: ollama/ollama:latest
    container_name: vps-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    network_mode: host
    profiles: ["ai"]

volumes:
  ollama-data:
